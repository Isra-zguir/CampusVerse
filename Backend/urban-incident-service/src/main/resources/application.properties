spring.application.name=urban-incident-service
server.port=8082

# In-memory H2 so the service starts without extra database setup (I3: compiles and runs).
# Switch to PostgreSQL later if needed (database-per-service: incidents_db).
spring.datasource.url=jdbc:h2:mem:incidents_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
