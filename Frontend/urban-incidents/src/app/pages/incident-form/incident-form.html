<a [routerLink]="isEdit ? ['/', id()] : ['/']" class="back">← Back</a>

<h1 style="margin-top: 1rem;">{{ isEdit ? 'Edit incident' : 'Report an incident' }}</h1>

@if (error()) {
  <div class="alert error">{{ error() }}</div>
}

<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-grid">
    <div class="full">
      <label for="title">Title *</label>
      <input id="title" formControlName="title" placeholder="e.g. Broken streetlight on Avenue Habib Bourguiba" />
      @if (invalid('title')) { <div class="field-error">Title is required (max 150 characters)</div> }
    </div>

    <div class="full">
      <label for="description">Description</label>
      <textarea id="description" rows="3" formControlName="description" placeholder="What happened? Add details for municipal agents."></textarea>
    </div>

    <div class="full">
      <label for="photoUrl">Photo URL</label>
      <input id="photoUrl" formControlName="photoUrl" placeholder="https://..." />
    </div>

    <div>
      <label for="location">Location *</label>
      <input id="location" formControlName="location" placeholder="Street, landmark..." />
      @if (invalid('location')) { <div class="field-error">Location is required</div> }
    </div>

    <div>
      <label for="neighborhood">Neighborhood</label>
      <input id="neighborhood" formControlName="neighborhood" />
    </div>

    <div>
      <label for="category">Category *</label>
      <select id="category" formControlName="category">
        @for (c of categories; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>

    <div>
      <label for="priority">Priority *</label>
      <select id="priority" formControlName="priority">
        @for (p of priorities; track p) {
          <option [value]="p">{{ p }}</option>
        }
      </select>
    </div>

    <div>
      <label for="reporterId">Citizen / reporter ID *</label>
      <input id="reporterId" type="number" min="1" formControlName="reporterId" />
    </div>
  </div>

  <div class="row" style="margin-top: 1.25rem;">
    <span class="spacer"></span>
    <a class="btn outline" [routerLink]="isEdit ? ['/', id()] : ['/']">Cancel</a>
    <button class="btn" type="submit" [disabled]="saving()">{{ isEdit ? 'Save changes' : 'Submit report' }}</button>
  </div>
</form>
